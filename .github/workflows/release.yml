name: Release APK

# 推送 v* 标签时自动构建 APK 并发布 GitHub Release
# 用法：git tag v0.4.8 && git push origin v0.4.8
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 运行器已预装 Android SDK 且许可已接受，无需 setup-android

      - name: 构建 APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 重命名 APK
        run: mv app/build/outputs/apk/debug/app-debug.apk 115-music-${{ github.ref_name }}.apk

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: 115-music-${{ github.ref_name }}.apk
          generate_release_notes: true
